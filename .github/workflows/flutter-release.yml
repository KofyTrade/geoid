name: Publicar version

# Publica el APK firmado en Releases al empujar una etiqueta (v2.0.0, v2.0.1...).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: APK de release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path flutter_app/pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($v -ne $tag) { throw "la etiqueta $tag no coincide con pubspec ($v)" }
          Write-Host "version correcta: $v"

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Recuperar la clave de firma
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > geoid-release.jks

      - name: Dependencias
        working-directory: flutter_app
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Compilar el APK
        working-directory: flutter_app
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/geoid-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Renombrar los APK
        run: |
          mkdir -p salida
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="manual"; fi
          ORIGEN="flutter_app/build/app/outputs/flutter-apk"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "$ORIGEN/app-$ABI-release.apk" \
               "salida/GeoiD-vpn-Android-${VERSION}-$ABI.apk"
          done
          ls -lh salida/

      - name: Publicar la version
        uses: softprops/action-gh-release@v2
        with:
          files: salida/*.apk
          name: GeoiD-vpn ${{ github.ref_name }}
          body: |
            GeoiD-vpn ${{ github.ref_name }} (Flutter).

            Instalalo encima de la version anterior: la app avisa sola
            cuando hay una version nueva.
          fail_on_unmatched_files: true
