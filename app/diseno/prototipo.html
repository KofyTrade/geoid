<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VlessGen — diseño v1</title>
<style>
  html,body{margin:0;height:100%;background:#04121a;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #lienzo{display:block;width:100%;height:100%}
  .ui{position:fixed;left:0;right:0;bottom:0;padding:0 24px 34px;
      display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
  #estado{color:#8fa9ad;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
      transition:color .5s}
  #estado.on{color:#22d3ee}
  #boton{pointer-events:auto;border:1px solid rgba(232,244,245,.18);background:rgba(10,30,36,.72);
      color:#e8f4f5;padding:15px 54px;border-radius:999px;font-size:16px;letter-spacing:.04em;
      backdrop-filter:blur(8px);cursor:pointer;transition:border-color .3s, transform .15s}
  #boton:hover{border-color:rgba(34,211,238,.6)}
  #boton:active{transform:scale(.97)}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div class="ui">
  <div id="estado">Desconectado</div>
  <button id="boton">Conectar</button>
</div>

<script>
(() => {
  "use strict";

  const cv = document.getElementById("lienzo");
  const ctx = cv.getContext("2d");
  const elEstado = document.getElementById("estado");
  const elBoton = document.getElementById("boton");

  let W = 0, H = 0, DPR = 1;

  function redimensionar() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    construirEstrellas();
  }

  // ---------------------------------------------------------------- geometría

  const T = (1 + Math.sqrt(5)) / 2;
  const VERTICES = [
    [-1, T, 0], [1, T, 0], [-1, -T, 0], [1, -T, 0],
    [0, -1, T], [0, 1, T], [0, -1, -T], [0, 1, -T],
    [T, 0, -1], [T, 0, 1], [-T, 0, -1], [-T, 0, 1]
  ].map(v => {
    const m = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / m, v[1] / m, v[2] / m];
  });

  const CARAS = [
    [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
    [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
    [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
    [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
  ];

  // Nodos de la esfera envolvente (espiral de Fibonacci)
  const NODOS = [];
  const N = 46, RADIO_ESFERA = 1.30;
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = i * 2.399963229728653;
    NODOS.push([Math.cos(th) * r * RADIO_ESFERA, y * RADIO_ESFERA, Math.sin(th) * r * RADIO_ESFERA]);
  }

  const ARISTAS = [];
  for (let i = 0; i < NODOS.length; i++) {
    for (let j = i + 1; j < NODOS.length; j++) {
      const a = NODOS[i], b = NODOS[j];
      const d = Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
      if (d < 0.66) ARISTAS.push([i, j]);
    }
  }

  // ------------------------------------------------------------------ estado

  let angulo = 0;
  let velocidad = 0.06;         // rad/s
  let objetivo = 0.06;
  let conectado = false;
  let ultimo = performance.now();

  // ----------------------------------------------------------------- estrellas

  let estrellas = [];
  function construirEstrellas() {
    estrellas = [];
    const n = Math.round((W * H) / 26000);
    for (let i = 0; i < n; i++) {
      estrellas.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.92,
        r: Math.random() * 0.9 + 0.25,
        a: Math.random() * 0.5 + 0.12
      });
    }
  }

  // ------------------------------------------------------------- proyección 3D

  const TILT = 0.26;   // inclinación fija, como el eje de la Tierra
  const CAM_Z = 3.15;

  function rotar(p, cosA, sinA, cosT, sinT) {
    // giro sobre Y
    let x = p[0] * cosA + p[2] * sinA;
    let z = -p[0] * sinA + p[2] * cosA;
    let y = p[1];
    // inclinación sobre X
    const y2 = y * cosT - z * sinT;
    const z2 = y * sinT + z * cosT;
    return [x, y2, z2];
  }

  function proyectar(p, escala, cx, cy) {
    const k = escala * CAM_Z / (p[2] + CAM_Z);
    return [cx + p[0] * k, cy + p[1] * k, p[2]];
  }

  // -------------------------------------------------------------------- dibujo

  function pintarFondo(t) {
    const g = ctx.createLinearGradient(0, -H * 0.25, 0, H * 1.1);
    g.addColorStop(0, "#12414A");
    g.addColorStop(0.42, "#0B2429");
    g.addColorStop(1, "#06171B");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // halo superior
    const h = ctx.createRadialGradient(W * 0.5, -H * 0.15, 0, W * 0.5, -H * 0.15, H * 0.9);
    h.addColorStop(0, "rgba(120,220,235,0.10)");
    h.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = h;
    ctx.fillRect(0, 0, W, H);

    for (const e of estrellas) {
      ctx.globalAlpha = e.a * (0.75 + 0.25 * Math.sin(t * 0.0007 + e.x));
      ctx.fillStyle = "#E8F4F5";
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function dibujar(ahora) {
    const dt = Math.min((ahora - ultimo) / 1000, 0.05);
    ultimo = ahora;

    velocidad += (objetivo - velocidad) * Math.min(1, dt * 3.2);
    angulo += velocidad * dt;

    const cosA = Math.cos(angulo), sinA = Math.sin(angulo);
    const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

    const cx = W / 2;
    const cy = H * 0.44;
    const escala = Math.min(W, H) * 0.215;

    pintarFondo(ahora);

    // círculo de apoyo
    ctx.strokeStyle = "rgba(232,244,245,0.10)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, escala * RADIO_ESFERA * 1.16, 0, Math.PI * 2);
    ctx.stroke();

    // esfera de nodos (detrás)
    const nodosProy = NODOS.map(n => proyectar(rotar(n, cosA, sinA, cosT, sinT), escala, cx, cy));

    ctx.lineWidth = 0.8;
    for (const [i, j] of ARISTAS) {
      const a = nodosProy[i], b = nodosProy[j];
      const prof = (a[2] + b[2]) / 2;
      ctx.strokeStyle = `rgba(232,244,245,${0.10 + 0.12 * (1 - (prof + 1.3) / 2.6)})`;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }

    // poliedro: caras ordenadas por profundidad
    const caras = CARAS.map(f => {
      const p = f.map(idx => rotar(VERTICES[idx], cosA, sinA, cosT, sinT));
      const proy = p.map(q => proyectar(q, escala, cx, cy));
      const z = (p[0][2] + p[1][2] + p[2][2]) / 3;
      return { proy, z, p };
    }).sort((a, b) => a.z - b.z);

    const luz = [-0.45, -0.62, 0.65];
    const lLen = Math.hypot(luz[0], luz[1], luz[2]);
    luz[0] /= lLen; luz[1] /= lLen; luz[2] /= lLen;

    for (const c of caras) {
      const [a, b, d] = c.p;
      const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2];
      const vx = d[0]-a[0], vy = d[1]-a[1], vz = d[2]-a[2];
      let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
      const nl = Math.hypot(nx, ny, nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;

      let dif = nx*luz[0] + ny*luz[1] + nz*luz[2];
      dif = Math.max(0, Math.abs(dif));
      const k = 0.10 + 0.52 * Math.pow(dif, 0.85);

      const r = Math.round(7 + 20 * k);
      const g = Math.round(10 + 28 * k);
      const bl = Math.round(12 + 31 * k);
      ctx.fillStyle = `rgb(${r},${g},${bl})`;

      ctx.beginPath();
      ctx.moveTo(c.proy[0][0], c.proy[0][1]);
      ctx.lineTo(c.proy[1][0], c.proy[1][1]);
      ctx.lineTo(c.proy[2][0], c.proy[2][1]);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(232,244,245,0.07)";
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }

    // nodos por delante
    for (let i = 0; i < nodosProy.length; i++) {
      const n = nodosProy[i];
      const cerca = (n[2] + 1.3) / 2.6;
      ctx.fillStyle = `rgba(232,244,245,${0.35 + 0.6 * cerca})`;
      ctx.beginPath();
      ctx.arc(n[0], n[1], 1.6 + 1.5 * cerca, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(dibujar);
  }

  // ------------------------------------------------------------------ control

  elBoton.addEventListener("click", () => {
    conectado = !conectado;
    objetivo = conectado ? 0.95 : 0.06;   // ~6,6 s/vuelta conectado
    elEstado.textContent = conectado ? "Conectado" : "Desconectado";
    elEstado.classList.toggle("on", conectado);
    elBoton.textContent = conectado ? "Desconectar" : "Conectar";
  });

  window.addEventListener("resize", redimensionar);
  redimensionar();
  requestAnimationFrame(dibujar);
})();
</script>
</body>
</html>
