<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador VLESS — v0.1</title>
<style>
  :root{
    --fondo:#0b0f14; --panel:#131a23; --borde:#243040;
    --texto:#e6edf3; --suave:#8b9bb0; --acento:#22d3ee; --ok:#34d399; --error:#f87171;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 64px; background:var(--fondo); color:var(--texto);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{max-width:760px;margin:0 auto}
  header{margin-bottom:24px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--suave);font-size:13px;margin:0}
  .card{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:18px;margin-bottom:16px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:0 0 14px}
  label{display:block;font-size:13px;color:var(--suave);margin-bottom:10px}
  input,select,textarea{
    width:100%;margin-top:4px;padding:9px 11px;border-radius:8px;
    border:1px solid var(--borde);background:#0e141b;color:var(--texto);
    font:14px/1.4 ui-monospace,Consolas,monospace;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acento)}
  textarea{min-height:70px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .grid .full{grid-column:1/-1}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  button{
    padding:10px 18px;border-radius:8px;border:1px solid var(--borde);
    background:#1b2632;color:var(--texto);font:600 14px inherit;cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--acento);color:var(--acento)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primario{background:var(--acento);color:#04202a;border-color:var(--acento)}
  button.primario:hover:not(:disabled){filter:brightness(1.1);color:#04202a}
  .acciones{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  pre{
    background:#0e141b;border:1px solid var(--borde);border-radius:8px;
    padding:12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;word-break:break-all;margin:0;min-height:22px;
  }
  .error{color:var(--error);font-size:13px;margin:6px 0}
  .ok{color:var(--ok);font-size:13px;margin:6px 0}
  #qr{display:flex;justify-content:center;margin-top:16px}
  #qr canvas{border-radius:8px;background:#fff;padding:8px}
  .pie{color:var(--suave);font-size:12px;text-align:center;margin-top:24px;line-height:1.7}
  .aviso{background:#3b2a12;border:1px solid #6b4c1f;color:#fbbf24;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Generador VLESS</h1>
    <p class="sub">v0.1 · construye y valida enlaces <code>vless://</code> con REALITY · todo ocurre en tu equipo</p>
  </header>

  <!-- 1. Importar -->
  <section class="card">
    <h2>1 · Importar un enlace existente (opcional)</h2>
    <textarea id="importar" placeholder="Pega aquí tu vless://... y pulsa Descomponer"></textarea>
    <div class="acciones">
      <button id="btnImportar">Descomponer</button>
    </div>
  </section>

  <!-- 2. Datos -->
  <section class="card">
    <h2>2 · Datos del servidor</h2>
    <div class="grid">
      <label>Nombre
        <input id="nombre" placeholder="mi-vps" autocomplete="off">
      </label>
      <label>Servidor (IP o dominio)
        <input id="host" placeholder="203.0.113.10" autocomplete="off">
      </label>
      <label>Puerto
        <input id="puerto" value="443" inputmode="numeric" autocomplete="off">
      </label>
      <label>SNI (sitio que se imita)
        <input id="sni" value="www.microsoft.com" autocomplete="off">
      </label>
      <label class="full">UUID
        <input id="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off">
      </label>
      <label class="full">Clave pública (pbk) — 43 caracteres
        <input id="pbk" placeholder="A-Z a-z 0-9 _ -" autocomplete="off">
      </label>
      <label>Short ID (sid) — hexadecimal
        <input id="sid" placeholder="1a2b3c4d5e6f7a8b" autocomplete="off">
      </label>
      <label>Flow
        <select id="flow">
          <option value="xtls-rprx-vision">xtls-rprx-vision</option>
          <option value="">(ninguno)</option>
        </select>
      </label>
      <label>Huella TLS (fp)
        <select id="fp">
          <option value="chrome">chrome</option>
          <option value="firefox">firefox</option>
          <option value="safari">safari</option>
          <option value="random">random</option>
        </select>
      </label>
    </div>
    <div id="avisos"></div>
  </section>

  <!-- 3. Resultado -->
  <section class="card">
    <h2>3 · Enlace resultante</h2>
    <pre id="enlace">—</pre>
    <div class="acciones">
      <button id="btnCopiar" class="primario" disabled>Copiar enlace</button>
      <button id="btnQR" disabled>Mostrar QR</button>
    </div>
    <div id="qr"></div>
  </section>

  <p class="pie">
    v0.1 · Tus datos se guardan solo en este navegador (localStorage).<br>
    Nada se envía a ningún servidor.
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const CAMPOS = ["nombre","host","puerto","uuid","pbk","sid","sni","flow","fp"];
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const PBK_RE  = /^[A-Za-z0-9_-]{43}$/;
  const SID_RE  = /^[0-9a-fA-F]{0,16}$/;

  function datos(){
    const o = {};
    CAMPOS.forEach(c => o[c] = $(c).value.trim());
    return o;
  }

  function validar(d){
    const e = [];
    if (!d.host) e.push("Falta la IP o el dominio del servidor.");
    if (!/^\d+$/.test(d.puerto) || +d.puerto < 1 || +d.puerto > 65535)
      e.push("El puerto debe ser un número entre 1 y 65535.");
    if (!UUID_RE.test(d.uuid))
      e.push("El UUID no tiene el formato correcto (8-4-4-4-12, hexadecimal).");
    if (!PBK_RE.test(d.pbk))
      e.push("La clave pública debe tener 43 caracteres; ahora tiene " + d.pbk.length + ".");
    if (!SID_RE.test(d.sid))
      e.push("El shortId debe ser hexadecimal y de 16 caracteres como máximo.");
    else if (d.sid.length % 2 !== 0)
      e.push("El shortId debe tener un número par de caracteres.");
    if (!d.sni) e.push("Falta el SNI (por ejemplo www.microsoft.com).");
    return e;
  }

  function construir(d){
    const q = new URLSearchParams();
    q.set("encryption","none");
    if (d.flow) q.set("flow", d.flow);
    q.set("security","reality");
    q.set("sni", d.sni);
    q.set("fp", d.fp);
    q.set("pbk", d.pbk);
    q.set("sid", d.sid);
    q.set("type","tcp");
    q.set("headerType","none");
    const host = d.host.includes(":") && !d.host.startsWith("[") ? "[" + d.host + "]" : d.host;
    const nombre = encodeURIComponent(d.nombre || "mi-vps");
    return "vless://" + d.uuid + "@" + host + ":" + d.puerto + "?" + q.toString() + "#" + nombre;
  }

  function pintar(){
    const d = datos();
    const errores = validar(d);
    $("avisos").innerHTML = errores.length
      ? errores.map(e => '<p class="error">✕ ' + e + '</p>').join("")
      : '<p class="ok">✓ Datos correctos</p>';

    const link = construir(d);
    const valido = errores.length === 0;
    $("enlace").textContent = valido ? link : "—";
    $("btnCopiar").disabled = !valido;
    $("btnQR").disabled = !valido;
    if (!valido) $("qr").innerHTML = "";

    localStorage.setItem("vless-campos", JSON.stringify(d));
    return valido ? link : null;
  }

  async function copiar(texto){
    try {
      await navigator.clipboard.writeText(texto);
      return true;
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = texto;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) {}
      document.body.removeChild(ta);
      return ok;
    }
  }

  function descomponer(){
    const s = $("importar").value.trim();
    const m = s.match(/^vless:\/\/([^@]+)@(\[[^\]]+\]|[^:]+):(\d+)\?([^#]*)(?:#(.*))?$/);
    if (!m) { alert("No parece un enlace vless:// válido."); return; }
    const [, uuid, host, puerto, qs, frag] = m;
    const p = new URLSearchParams(qs);
    $("uuid").value = uuid;
    $("host").value = host.replace(/^\[|\]$/g, "");
    $("puerto").value = puerto;
    $("pbk").value  = p.get("pbk") || "";
    $("sid").value  = p.get("sid") || "";
    $("sni").value  = p.get("sni") || "";
    if (p.get("flow")) $("flow").value = p.get("flow");
    if (p.get("fp"))   $("fp").value   = p.get("fp");
    if (frag) $("nombre").value = decodeURIComponent(frag);
    pintar();
  }

  // --- eventos ---
  CAMPOS.forEach(c => $(c).addEventListener("input", pintar));
  CAMPOS.forEach(c => $(c).addEventListener("change", pintar));
  $("btnImportar").addEventListener("click", descomponer);

  $("btnCopiar").addEventListener("click", async () => {
    const link = pintar();
    if (!link) return;
    const ok = await copiar(link);
    const b = $("btnCopiar");
    const previo = b.textContent;
    b.textContent = ok ? "✓ Copiado" : "No se pudo copiar";
    setTimeout(() => { b.textContent = previo; }, 1500);
  });

  $("btnQR").addEventListener("click", () => {
    const link = pintar();
    if (!link) return;
    const caja = $("qr");
    caja.innerHTML = "";
    if (typeof QRCode === "undefined") {
      caja.innerHTML = '<p class="error">No se pudo cargar el generador de QR. Usa "Copiar enlace".</p>';
      return;
    }
    const canvas = document.createElement("canvas");
    QRCode.toCanvas(canvas, link, { width: 260, margin: 1 }, err => {
      if (err) {
        caja.innerHTML = '<p class="error">Error al generar el QR.</p>';
        return;
      }
      caja.appendChild(canvas);
    });
  });

  // --- arranque: recuperar lo guardado ---
  try {
    const guardado = JSON.parse(localStorage.getItem("vless-campos") || "{}");
    CAMPOS.forEach(c => { if (guardado[c] !== undefined) $(c).value = guardado[c]; });
  } catch (e) {}
  pintar();
})();
</script>
</body>
</html>
